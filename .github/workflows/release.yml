name: Release & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build Release & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: "https://registry.npmjs.org"

      - name: Resolve Dynamic Version from Git Tag
        id: vars
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG_NAME="v$VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "NINEROUTER_VERSION=$VERSION" >> $GITHUB_ENV
        shell: bash

      - name: Install Dependencies
        run: |
          npm install --no-audit --no-fund
          cd cli && npm install --no-audit --no-fund
        shell: bash

      - name: Package CLI Distribution
        run: |
          cd cli && npm run pack:cli
          cd ..
          # Create stable release asset aliases for persistent latest download links
          TARBALL=$(ls 9router-*.tgz | head -n 1)
          if [ -f "$TARBALL" ]; then
            cp "$TARBALL" 9router-extended.tgz
            cp "$TARBALL" 9router-latest.tgz
          fi
          ls -la *.tgz
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: 9Router v${{ steps.vars.outputs.version }}
          tag_name: ${{ steps.vars.outputs.tag_name }}
          files: "*.tgz"
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NPM Registry
        if: env.NPM_TOKEN != ''
        working-directory: cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
