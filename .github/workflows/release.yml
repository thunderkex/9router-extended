name: Release & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build Release & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: |
          npm install --no-audit --no-fund
          cd cli && npm install --no-audit --no-fund
        shell: bash

      - name: Package CLI Distribution
        run: |
          cd cli && npm run pack:cli
        shell: bash

      - name: Extract Tag or Version
        id: vars
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: 9Router v${{ steps.vars.outputs.version }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && steps.vars.outputs.tag_name || format('v{0}', steps.vars.outputs.version) }}
          files: "*.tgz"
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.vars.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NPM Registry
        if: env.NPM_TOKEN != ''
        working-directory: cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
